<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#8B4513" />
  <title>中國象棋 · Xiangqi</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 主選單 -->
    <div id="menu" class="screen active">
      <h1>中國象棋</h1>
      <p class="subtitle">Xiangqi Online</p>
      <div class="menu-btns">
        <button class="btn primary" data-mode="local">本地雙人對戰</button>
        <button class="btn primary" data-mode="ai">人機對戰</button>
        <button class="btn accent" data-mode="create">建立房間（線上）</button>
        <button class="btn accent" data-mode="join">加入房間</button>
      </div>
      <div class="join-box" id="joinBox" style="display:none">
        <input type="text" id="roomCodeInput" placeholder="輸入房間代碼" maxlength="8" autocomplete="off" />
        <button class="btn" id="joinConfirmBtn">連線</button>
      </div>
      <p class="hint">線上對戰使用 PeerJS 點對點連線，無需帳號</p>
    </div>

    <!-- 遊戲畫面 -->
    <div id="game" class="screen">
      <header class="top-bar">
        <button class="icon-btn" id="backBtn" title="返回選單">←</button>
        <div class="status" id="statusText">紅方回合</div>
        <div class="room-info" id="roomInfo" style="display:none">
          房間：<span id="roomCodeDisplay"></span>
          <button class="copy-btn" id="copyCodeBtn">複製</button>
        </div>
      </header>

      <div class="board-wrapper">
        <canvas id="board" width="450" height="500"></canvas>
      </div>

      <div class="controls">
        <button class="btn small" id="undoBtn">悔棋</button>
        <button class="btn small" id="resignBtn">認輸</button>
        <button class="btn small" id="restartBtn">重新開始</button>
      </div>

      <div class="side-info">
        <div class="player red">紅方 <span id="redSide"></span></div>
        <div class="player black">黑方 <span id="blackSide"></span></div>
      </div>
    </div>

    <!-- 結果彈窗 -->
    <div id="resultModal" class="modal">
      <div class="modal-content">
        <h2 id="resultTitle">遊戲結束</h2>
        <p id="resultMsg"></p>
        <button class="btn primary" id="resultOk">確定</button>
      </div>
    </div>

    <!-- 連線中提示 -->
    <div id="connecting" class="modal">
      <div class="modal-content">
        <p>正在連線中...</p>
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <script src="lib/peerjs.min.js"></script>
  <script src="lib/xiangqi.js"></script>
  <script src="js/board.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/multiplayer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
